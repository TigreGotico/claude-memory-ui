[project]
name = "claude-memory-ui"
version = "0.1.0"
description = "Web UI for viewing and managing Claude Code memories, plans, and project sessions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["claude", "claude-code", "ai", "memory", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
claude-memory-ui = "app:main"

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/claude-memory-ui"
Issues = "https://github.com/OpenVoiceOS/claude-memory-ui/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.package-data]
"*" = ["static/*"]
